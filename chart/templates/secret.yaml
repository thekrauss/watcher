{{- /*
Secret API key — créé UNIQUEMENT si :
  (a) kubemanager.apiKey est fourni en clair via --set (NE PAS utiliser en prod)
  (b) kubemanager.apiKeyExistingSecret est vide (sinon on référence l'existant)

En prod, préférer :
  1. ExternalSecrets qui synchronise depuis Vault/AWS Secrets Manager
  2. kubectl create secret generic watcher-api-key --from-literal=api-key=...
     puis --set kubemanager.apiKeyExistingSecret=watcher-api-key

L'apiKey est encodée Base64 par Helm via le type `stringData`.
*/ -}}
{{- if and .Values.kubemanager.apiKey (not .Values.kubemanager.apiKeyExistingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "watcher.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "watcher.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.kubemanager.apiKey | quote }}
{{- end }}
